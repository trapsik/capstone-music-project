name: Plimo CD (Auto Deploy)

# 언제 이 작업을 실행할까요?
on:
  push:
    branches:
    - feature/display-recommendation-result # ★주의: 본인 브랜치 이름이 master라면 master로 수정!

# 해야 할 작업 목록
jobs:
  deploy:
    runs-on: ubuntu-latest  # 깃허브가 제공하는 임시 컴퓨터(Ubuntu)에서 실행

    steps:
    # 1. 깃허브에 올라온 내 코드를 이 임시 컴퓨터로 가져옵니다.
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 자바 17 버전을 설치합니다. (프로젝트 버전에 맞게 수정 가능)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Gradle에게 실행 권한을 주고, 빌드해서 JAR 파일을 만듭니다.
    - name: Build with Gradle
      run: |
        cd capstone-music-project    # 프로젝트 폴더 안으로 이동!
        chmod +x gradlew
        ./gradlew clean bootJar

    # 4. 만들어진 JAR 파일을 내 EC2 서버로 전송합니다. (scp)
    - name: Transfer JAR to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}      # 1단계에서 등록한 비밀키 사용
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "capstone-music-project/build/libs/*.jar"         # 전송할 파일 위치
        target: "/home/ubuntu/plimo-springboot" # EC2 어디에 넣을지 (폴더명 확인!)
        strip_components: 3                # build/libs/ 경로 떼고 파일만 보냄

    # 5. EC2에 접속해서 기존 서버를 끄고, 새 서버를 실행합니다. (ssh)
    - name: Deploy and Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # EC2 안에서 실행될 명령어들입니다.
          
          # 1. 실행 중인 Spring Boot 서버(java)가 있으면 찾아서 끕니다.
          PID=$(ps -ef | grep java | grep -v grep | awk '{print $2}')
          if [ -z "$PID" ]; then
            echo "실행 중인 서버가 없습니다."
          else
            echo "기존 서버 종료 중... PID: $PID"
            kill -9 $PID
          fi

          # 2. 잠시 대기 (확실히 꺼질 때까지)
          sleep 5

          # 3. 프로젝트 폴더로 이동
          cd /home/ubuntu/plimo-springboot

          # 4. 불필요한 plain.jar 파일 삭제 (껍데기 파일)
          rm -f *-plain.jar

          # 5. 새 서버 실행 (nohup으로 백그라운드 실행)
          # 로그는 nohup.out에 저장됨
          nohup java -jar *.jar > nohup.out 2>&1 &
          
          echo "배포가 완료되었습니다!"