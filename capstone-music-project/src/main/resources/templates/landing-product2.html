<style>
  /* --- 1. 앨범 부드럽게 등장 (Fade-in) --- */
  #album-track {
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }
  #album-track.loaded {
    opacity: 1;
  }

  /* --- 2. 앨범 잘림 방지 및 솟아오르기 (축 분리 최종판) --- */
  
  /*
    (★핵심★)
    부모 컨테이너(가면)에게
    "옆으로는" 자르고 (hidden)
    "위로는" 삐져나오게 (visible) 허용합니다.
  */
  .slider-container,
  .table-responsive-xl {
    overflow-x: hidden !important; /* 옆으로 가는 건 잘라라! */
    overflow-y: visible !important; /* 위로 솟는 건 봐줘라! */
  }

  /* 컨베이어 벨트 자체도 위로 삐져나오는 것을 허용합니다.
  */
  .slider-track {
    overflow-y: visible !important;
    padding-top: 80px;
  }

  .slider-item {
    transition: transform 0.3s ease-in-out;
    position: relative; /* z-index를 적용하려면 필수 */
    z-index: 1; /* 평소에는 기본 z-index */
  }

  .slider-item:hover {
    transform: translateY(-80px);
    z-index: 80; /* 마우스를 올리면 다른 앨범들 위로 솟아오름 */
  }

  /* --- 3. 컨베이어 벨트 멈추기 (최후의 수단) --- */
  .slider-track:hover {
    animation-play-state: paused;
  }
</style>
